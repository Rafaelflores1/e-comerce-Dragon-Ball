<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card border-0 shadow-lg p-4">
        <h3 class="fw-bold text-center mb-4 text-warning">Iniciar Sesión</h3>

        @if (errorMessage()) {
          <div class="alert alert-danger mb-3">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ errorMessage() }}
          </div>
        }

        <form (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label class="form-label fw-bold">Correo Electrónico</label>
            <input type="email" class="form-control" [(ngModel)]="email" name="email" placeholder="correo@ejemplo.com" required>
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold">Contraseña</label>
            <input type="password" class="form-control" [(ngModel)]="password" name="password" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn btn-warning w-100 fw-bold btn-lg" [disabled]="isLoading()">
            @if (isLoading()) {
              <span class="spinner-border spinner-border-sm me-2"></span> Ingresando...
            } @else {
              Iniciar Sesión
            }
          </button>
        </form>

        <div class="text-center mt-4">
          <span class="text-muted">¿No tienes cuenta? </span>
          <a routerLink="/auth/registro" class="fw-bold text-warning text-decoration-none">Regístrate gratis</a>
        </div>
      </div>
    </div>
  </div>
</div>
